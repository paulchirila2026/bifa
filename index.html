<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="sbStyle">
<meta name="apple-mobile-web-app-title" content="Bifa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="favicon.png">
<title>Bifa</title>
<style>
@font-face{font-family:"Inter Variable";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Inter Variable";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Culori și dimensiuni după ghidul Apple (iOS) */
:root{
  --accent:#007aff; --list:var(--accent);
  --bg:#f2f2f7; --cell:#ffffff; --cell-h:#e9e9ee; --cell2:#ffffff; --sheet:#f2f2f7;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --scrim:rgba(0,0,0,.28); --bar:rgba(242,242,247,.82);
  --red:#ff3b30; --orange:#ff9500;
  --ease:cubic-bezier(.2,.85,.25,1);
  color-scheme:light;
}
:root.dark{
  --bg:#000000; --cell:#1c1c1e; --cell-h:#2c2c2e; --cell2:#2c2c2e; --sheet:#1c1c1e;
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --scrim:rgba(0,0,0,.5); --bar:rgba(0,0,0,.72);
  --red:#ff453a; --orange:#ff9f0a;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* pagina nu se poate deplasa lateral (pe iPhone, tastatura o muta altfel și nu o mai aduce înapoi) */
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#app{width:100%;overflow:hidden}
.scroll,.sheet,#detail .sh-body{overflow-x:hidden;touch-action:pan-y}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter Variable","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-feature-settings:"cv11","ss01";
  background:var(--bg);color:var(--label);font-size:16px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
/* ===== animații și finisaje ===== */
.irow .chk svg path{stroke-dasharray:30;stroke-dashoffset:0}
.irow.pop.done .chk svg path{animation:drawchk .34s .06s var(--ease) both}
@keyframes drawchk{from{stroke-dashoffset:30}}
.chk{position:relative}
.irow.pop.done .chk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--list);animation:ring .5s ease-out both;pointer-events:none}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(2.1);opacity:0}}
.irow.leaving{transition:opacity .2s,transform .25s var(--ease)}
.irow.removing{overflow:hidden;transition:height .26s var(--ease),opacity .2s,transform .26s var(--ease),margin .26s,padding .26s;opacity:0;transform:scale(.96)}
.rise-in{animation:rowin .38s var(--ease) both}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
.star.bounce svg{animation:starb .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes starb{0%{transform:scale(.6) rotate(-20deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:none}}
.spin-once svg{animation:spin1 .7s var(--ease)}
@keyframes spin1{to{transform:rotate(90deg)}}
.prog{display:flex;align-items:center;gap:10px;margin:14px 16px 0;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.prog .pbar{flex:1;height:6px;border-radius:99px;background:color-mix(in oklab,var(--list) 16%,transparent);overflow:hidden}
.prog .pbar i{display:block;height:100%;border-radius:inherit;background:var(--list);transition:width .6s var(--ease)}
#main.vivid .prog{color:rgba(255,255,255,.85)}
#main.vivid .prog .pbar{background:rgba(255,255,255,.22)}
#main.vivid .prog .pbar i{background:#fff}
.empty .badge{position:relative;animation:floaty 4s ease-in-out infinite}
.empty .badge::before,.empty .badge::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:color-mix(in oklab,var(--c,var(--list)) 14%,transparent);z-index:-1;animation:halo 3s ease-in-out infinite}
.empty .badge::after{inset:-30px;background:color-mix(in oklab,var(--c,var(--list)) 7%,transparent);animation-delay:.4s}
.empty{position:relative;z-index:0}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes halo{50%{transform:scale(1.08)}}
.empty .em-sub{display:block;margin-top:2px}
.fab{background:color-mix(in oklab,var(--list) 88%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 10px 28px color-mix(in oklab,var(--list) 38%,transparent),0 2px 6px rgba(0,0,0,.15)}
#main.vivid .fab{background:rgba(255,255,255,.9)}
.sheet{background:color-mix(in oklab,var(--sheet) 86%,transparent);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8)}
.scrolled > .nav{background:color-mix(in oklab,var(--bar) 70%,transparent)}
.fly{position:fixed;z-index:60;margin:0;pointer-events:none;transform-origin:0 0;white-space:nowrap;transition:transform .42s var(--ease),color .42s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.count-up{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.empty .badge,.empty .badge::before,.empty .badge::after{animation:none!important}}
.no-anim *,.no-anim *::before,.no-anim *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (min-width:761px){
  #app.with-detail #detail > *{animation:detin .46s cubic-bezier(.2,1.25,.35,1) both}
  @keyframes detin{from{transform:translateX(40px);opacity:0}}
  .prog{margin:14px 0 0;max-width:430px}
}
#tbDrag{display:none}
#lock{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0c0c0c;color:#fff;-webkit-user-select:none;user-select:none}
#lock[hidden]{display:none}
#lock img{width:84px;height:84px;border-radius:20px;margin-bottom:6px}
#lock b{font-size:22px;font-weight:700}
#lock span{color:#9a9a9a;font-size:15px}
#lock button{margin-top:18px;padding:12px 26px;border-radius:999px;background:#ff7a1a;color:#111;font-weight:600;font-size:16px}
@media (display-mode: window-controls-overlay){
  #tbDrag{display:block;position:fixed;z-index:50;top:0;left:env(titlebar-area-x,0);width:env(titlebar-area-width,100%);height:env(titlebar-area-height,32px);-webkit-app-region:drag;app-region:drag}
  html,body{background:var(--win,var(--bg))}
  #app{height:calc(100% - env(titlebar-area-height,32px));margin-top:env(titlebar-area-height,32px)}
  .d-head{padding-top:6px!important}
}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
svg{display:block;flex:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--fill2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

#app{display:grid;grid-template-columns:320px 1fr 0;height:100%;transition:grid-template-columns .28s var(--ease)}
#app.side-hidden{grid-template-columns:0 1fr 0}
#app.with-detail{grid-template-columns:320px 1fr 380px}
#app.side-hidden.with-detail{grid-template-columns:0 1fr 380px}
#app>*{min-width:0;overflow:hidden}
.side-btn{display:grid}

/* ===== bară de navigare ===== */
.nav{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;min-height:calc(52px + env(safe-area-inset-top));
  transition:background .2s,box-shadow .2s}
.nav .l{justify-self:start}.nav .r{justify-self:end;display:flex;gap:8px}
.nav-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.scrolled > .nav{background:var(--bar);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);box-shadow:0 .5px 0 var(--sep)}
.scrolled > .nav .nav-title{opacity:1}
.back{display:none;align-items:center;gap:2px;color:var(--list);font-size:17px;margin-left:-8px;padding:4px 6px 4px 0}
.circ{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--list);transition:transform .15s,background .15s}
.circ:hover{background:var(--fill2)}
.circ:active{transform:scale(.92)}

/* ===== bara laterală / ecranul principal ===== */
#side{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:.5px solid var(--sep);--list:var(--accent)}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:calc(-52px - env(safe-area-inset-top));padding-top:calc(52px + env(safe-area-inset-top))}
.big-title{padding:2px 20px 0}
.big-title h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;display:flex;align-items:center;gap:10px}
.big-title .sub{color:var(--label2);font-size:15px;margin-top:2px}
.t-badge{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 16px 4px}
.tile{background:var(--cell);border-radius:14px;padding:10px 12px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,background .15s}
.tile:active{transform:scale(.97)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile b{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile span.lb{color:var(--label2);font-weight:600;font-size:15px}
.tile.active{outline:2.5px solid var(--c);outline-offset:-2.5px}
.sec-title{font-size:20px;font-weight:700;letter-spacing:-.02em;padding:22px 20px 8px}
.group{background:var(--cell);border-radius:12px;margin:0 16px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px 9px 12px;text-align:left;position:relative;transition:background .12s}
.lrow:hover{background:var(--cell-h)}
.lrow.active{background:color-mix(in oklab,var(--c) 14%,var(--cell))}
.lrow+.lrow::before{content:"";position:absolute;top:0;right:0;left:56px;height:.5px;background:var(--sep)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.lrow .ct{color:var(--label2);font-size:17px;font-variant-numeric:tabular-nums}
.lrow .chev{color:var(--label3);display:none}
.badge{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:17px}
.badge.lg{width:36px;height:36px}
.side-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:.5px solid var(--sep)}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--label2);min-width:0}
.sync span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--label3);flex:none}
.dot.ok{background:#34c759}.dot.syncing{background:var(--accent);animation:pulse 1s infinite}.dot.offline{background:var(--orange)}.dot.error{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.txt-btn{color:var(--accent);font-size:17px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 0}
.txt-btn:active{opacity:.5}

/* ===== lista deschisă ===== */
#main{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;--tint:var(--bg);background:var(--tint);transition:background .3s}
#main.soft{--tint:color-mix(in oklab,var(--list) 11%,var(--bg))}
.dark #main.soft{--tint:color-mix(in oklab,var(--list) 17%,var(--bg))}
#main.vivid{--tint:var(--list);background:linear-gradient(180deg,color-mix(in oklab,var(--list) 58%,#5f6670) 0%,color-mix(in oklab,var(--list) 40%,#2b2f36) 100%);background-color:color-mix(in oklab,var(--list) 58%,#5f6670)}
.dark #main.vivid{--tint:#000;background:linear-gradient(180deg,#000 0%,#000 15%,color-mix(in oklab,var(--list) 62%,#000) 100%);background-color:#000}
#main .big-title h1{color:var(--list)}
#main.vivid .big-title h1,#main.vivid .big-title .sub,#main.vivid .back,#main.vivid .sect-h,#main.vivid .group-h{color:#fff}
#main.vivid .circ{background:rgba(255,255,255,.22);color:#fff}
#main.vivid.scrolled > .nav{background:color-mix(in oklab,color-mix(in oklab,var(--list) 55%,#4a5058) 85%,transparent)}
#main.vivid .nav-title{color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 16px 0}
.stat{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px;background:var(--cell);border-radius:14px;padding:12px 16px 12px 12px}
.stat .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--list);background:color-mix(in oklab,var(--list) 13%,transparent)}
.stat .l{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px;letter-spacing:-.02em;white-space:nowrap}
#items{padding:16px 0 120px}
.group-h{font-size:20px;font-weight:700;letter-spacing:-.02em;padding:18px 20px 8px;color:var(--c,var(--label))}
.group-h:first-child{padding-top:0}
.irow{display:flex;align-items:flex-start;gap:12px;padding:11px 16px 11px 14px;position:relative;background:var(--cell);transition:background .12s,opacity .25s,transform .25s;animation:in .25s var(--ease) both}
.irow:hover{background:var(--cell-h)}
.irow+.irow::before{content:"";position:absolute;top:0;right:0;left:50px;height:.5px;background:var(--sep)}
@keyframes in{from{opacity:0}}
.compact .irow{padding-top:7px;padding-bottom:7px}
.chk{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);flex:none;display:grid;place-items:center;color:transparent;transition:.18s var(--ease);margin-top:-1px}
.chk:hover{border-color:var(--list)}
.irow.done .chk{background:var(--list);border-color:var(--list);color:#fff}
.irow.pop .chk{animation:pop .35s var(--ease)}
@keyframes pop{40%{transform:scale(1.22)}}
.irow.leaving{opacity:0;transform:translateX(12px)}
.irow .body{flex:1;min-width:0;cursor:pointer}
.irow.sel{background:color-mix(in oklab,var(--list) 12%,var(--cell))}
.star{width:28px;height:28px;display:grid;place-items:center;color:var(--label3);flex:none;margin:-3px -6px -3px 0;border-radius:50%;transition:color .15s,transform .15s}
.star:hover{color:var(--list)}
.star.on{color:var(--list)}
.star.on svg{fill:currentColor}
@media (hover:hover){.irow .star:not(.on){opacity:0;transition:opacity .15s}.irow:hover .star{opacity:1}}
.star:active{transform:scale(.85)}
.done-btn{display:inline-flex;align-items:center;gap:6px;margin:20px 16px 8px;padding:6px 12px 6px 8px;border-radius:9px;background:var(--fill);color:var(--label);font-weight:600;font-size:15px}
.done-btn svg{transition:transform .2s var(--ease);color:var(--label2)}
.done-btn.closed svg{transform:rotate(-90deg)}
.done-btn .n{color:var(--label2);font-weight:500}
#main.vivid .done-btn{background:rgba(255,255,255,.22);color:#fff}
#main.vivid .done-btn svg,#main.vivid .done-btn .n{color:#fff}
/* panoul de detalii (PC) */
#detail{background:var(--sheet);border-left:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0}
#detail .sh-body{flex:1;overflow:auto}
.d-title{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.d-title input{flex:1;border:0;outline:0;background:none;font-size:20px;font-weight:600;min-width:0;padding:1px 0}
.d-title .chk{margin-top:2px}
.step{display:flex;align-items:center;gap:12px;padding:8px 14px;position:relative}
.step+.step::before,.step+.add-step::before{content:"";position:absolute;top:0;right:0;left:48px;height:.5px;background:var(--sep)}
.step .chk{width:20px;height:20px}
.step input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.step.done input{color:var(--label2);text-decoration:line-through}
.step .x{color:var(--label3);width:24px;height:24px;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.step:hover .x{opacity:1}
@media (hover:none){.step .x{opacity:1}}
.add-step{display:flex;align-items:center;gap:12px;padding:9px 14px;color:var(--accent);position:relative}
.add-step input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--label)}
.add-step input::placeholder{color:var(--accent)}
.myday-on{color:var(--accent)!important;font-weight:500}
.dsel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px 12px}
.dsel .q{background:var(--fill);border-radius:16px;padding:6px 12px;font-size:14px;font-weight:500}
.dsel .q.on{background:var(--accent);color:#fff}
.dsel select{background:var(--fill);border:0;outline:0;border-radius:9px;padding:6px 8px;font-size:15px;color:var(--label);text-align:left;max-width:none}
.dsel .sp{flex:1}
.d-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:.5px solid var(--sep);color:var(--label2);font-size:13px}
.d-foot button{color:var(--red);width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.d-foot button:hover{background:var(--fill)}
.d-foot button.armed{background:var(--red);color:#fff}
.c-date{padding-top:10px}
.c-date .dsel{background:var(--cell2);border-radius:12px;padding:10px 12px}
.pill select{border:0;outline:0;background:none;font-size:15px;color:inherit}
.bullet{width:24px;height:22px;flex:none;display:grid;place-items:center}
.bullet::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--list)}
.irow.plain+.irow.plain::before{left:50px}
.kind{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 12px;text-align:left;position:relative;transition:background .12s}
.kind:hover,.kind:active{background:var(--cell-h)}
.kind+.kind::before{content:"";position:absolute;top:0;right:0;left:58px;height:.5px;background:var(--sep)}
.kind .tx{flex:1;min-width:0}
.kind .tx b{display:block;font-weight:500;font-size:17px}
.kind .tx small{display:block;color:var(--label2);font-size:13.5px;margin-top:1px}
.kind .chev{color:var(--label3)}
.restart{margin-top:16px;background:var(--list);color:#fff;border-radius:22px;padding:10px 20px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.irow .t{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.irow.done .t{color:var(--label2)}
.meta{font-size:14px;color:var(--label2);margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 12px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .late{color:var(--red)}.meta .today{color:var(--orange)}
.meta .lst{color:var(--c)}
.irow .amt{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--label);padding-top:1px}
.irow.done .amt{color:var(--label2)}
.sect-h{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 8px;color:var(--label2);font-size:15px}
.sect-h button{color:var(--list);font-size:15px;font-weight:500}
#main.vivid .sect-h button{color:#fff;font-weight:600}
.empty{text-align:center;padding:70px 30px;color:var(--label2)}
.empty .badge{width:64px;height:64px;margin:0 auto 14px}
.empty b{display:block;font-size:20px;color:var(--label);margin-bottom:4px}
#main.vivid .empty,#main.vivid .empty b{color:#fff}

.fab{position:absolute;right:22px;bottom:calc(24px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  background:var(--list);color:#fff;display:grid;place-items:center;z-index:5;
  box-shadow:0 8px 24px color-mix(in oklab,var(--list) 40%,transparent),0 2px 6px rgba(0,0,0,.15);transition:transform .2s var(--ease)}
.fab:hover{transform:scale(1.05)}.fab:active{transform:scale(.92)}
#main.vivid .fab{background:#fff;color:var(--list)}

/* ===== foi (ferestre iOS) ===== */
.scrim{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .22s ease both}
.scrim.closing{animation:fade .2s ease reverse both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--sheet);color:var(--label);border-radius:14px;width:100%;max-width:480px;max-height:calc(100% - 30px);overflow:auto;
  box-shadow:0 20px 70px rgba(0,0,0,.3);animation:rise .32s var(--ease) both}
.scrim.closing .sheet{animation:rise .2s ease reverse both}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.grab{display:none;width:36px;height:5px;border-radius:5px;background:var(--label3);margin:7px auto 0}
.sh-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 10px;background:var(--sheet)}
.sh-head b{font-size:17px;font-weight:600}
.sh-btn{color:var(--accent);font-size:17px;justify-self:start}
.sh-btn.strong{font-weight:600;justify-self:end}
.sh-btn:disabled{opacity:.35}
.sh-body{padding:4px 16px 24px}
.fgroup{background:var(--cell2);border-radius:12px;overflow:hidden;margin-top:18px}
.fgroup:first-child{margin-top:6px}
.fh{font-size:13px;color:var(--label2);text-transform:uppercase;padding:22px 16px 7px;letter-spacing:.01em}
.fh+.fgroup{margin-top:0}
.ff{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.4}
.frow{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 16px;position:relative;cursor:default}
.frow+.frow::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.frow .fl{flex:1;font-size:17px}
.frow .fl small{display:block;font-size:13px;color:var(--label2)}
.frow input:not([type=checkbox]),.frow select{border:0;outline:0;background:none;text-align:right;font-size:17px;color:var(--label2);min-width:0;max-width:60%}
.frow input:focus{color:var(--label)}
.frow input[type=date]{color:var(--accent)}
.frow.input input{text-align:left;max-width:none;flex:1;color:var(--label);padding:6px 0}
.frow textarea{border:0;outline:0;background:none;width:100%;resize:vertical;min-height:84px;font-size:17px;padding:8px 0}
.frow.btnrow{justify-content:center;color:var(--accent);font-size:17px;cursor:pointer}
.frow.btnrow:active{background:var(--cell-h)}
.frow.btnrow.red{color:var(--red)}
.frow.btnrow.armed{background:var(--red);color:#fff}
.frow.btnrow[aria-disabled=true]{opacity:.4;pointer-events:none}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:31px;background:var(--fill2);position:relative;cursor:pointer;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s var(--ease)}
.sw:checked{background:#34c759}
.sw:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:10px 16px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.dark .seg button.on{background:#636366}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px 16px;justify-items:center}
.swatch{width:38px;height:38px;border-radius:50%;background:var(--c);transition:transform .15s var(--ease)}
.swatch:active{transform:scale(.9)}
.swatch.on{box-shadow:0 0 0 3px var(--cell2),0 0 0 6px color-mix(in oklab,var(--c) 55%,transparent)}
.swatch.auto{background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#007aff,#af52de,#ff3b30)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px 16px;justify-items:center}
.icons button{width:42px;height:42px;border-radius:50%;background:var(--fill);color:var(--label2);display:grid;place-items:center;transition:transform .15s}
.icons button:active{transform:scale(.9)}
.icons button.on{background:var(--c);color:#fff}
.preview{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 16px 18px}
.preview .badge{width:88px;height:88px;box-shadow:0 8px 24px color-mix(in oklab,var(--c) 40%,transparent)}
.preview input{width:100%;background:var(--fill);border:0;outline:0;border-radius:12px;padding:12px;text-align:center;font-size:22px;font-weight:700;color:var(--c)}
.msg{font-size:13px;padding:8px 16px 0}.msg.ok{color:#34c759}.msg.bad{color:var(--red)}
.foot{font-size:12px;color:var(--label3);text-align:center;margin-top:24px}

/* compunere element nou */
.composer .sh-body{padding:10px 16px 16px}
.c-in{display:flex;align-items:center;gap:12px;background:var(--cell2);border-radius:12px;padding:8px 8px 8px 14px}
.c-in .ring{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);flex:none}
.c-in input{flex:1;border:0;outline:0;background:none;font-size:17px;min-width:0;padding:6px 0}
.send{width:34px;height:34px;border-radius:50%;background:var(--list);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .15s}
.send:disabled{opacity:.3}
.send:not(:disabled):active{transform:scale(.9)}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cell2);border-radius:20px;padding:8px 13px;font-size:15px;color:var(--label2);position:relative;transition:background .15s,color .15s;cursor:pointer}
.pill.on{background:var(--list);color:#fff}
.pill.on input{color:#fff}.pill.on input::placeholder{color:rgba(255,255,255,.7)}
.pill input{border:0;outline:0;background:none;width:82px;font-size:15px}
.pill input[type=date]{position:absolute;inset:0;width:auto;opacity:0;cursor:pointer}

/* ===== elemente doar pentru PC / doar pentru telefon ===== */
.d-only{display:none!important}
#addBar.hidden-bar{display:none!important}
.m-search{display:flex;align-items:center;gap:6px;margin:12px 16px 0;background:var(--fill);border-radius:10px;padding:0 10px;color:var(--label2)}
.m-search input{flex:1;border:0;outline:0;background:none;font-size:17px;padding:8px 0;color:var(--label);min-width:0}
/* meniu contextual + notificare */
.ctx{position:fixed;z-index:50;min-width:230px;background:var(--menu,#fff);border-radius:8px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);animation:ctxin .12s ease both;font-size:14px}
.dark .ctx{--menu:#2c2c2c;box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.08)}
@keyframes ctxin{from{opacity:0;transform:scale(.97)}}
.ctx button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:4px;text-align:left;color:var(--label)}
.ctx button:hover{background:var(--fill)}
.ctx button svg{color:var(--label2)}
.ctx button.danger,.ctx button.danger svg{color:var(--red)}
.ctx .sep{height:1px;background:var(--sep);margin:4px 0}
.ctx .hd{padding:6px 12px 4px;font-size:12px;color:var(--label2)}
.ctx .dot2{width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 2px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;
  background:#2b2b2b;color:#fff;padding:10px 12px 10px 16px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.3);font-size:14px;animation:tin .2s var(--ease) both}
.toast button{color:#7ab4ff;font-weight:600;padding:4px 6px}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* ===== PC: aspect în stilul Microsoft To Do (Windows) ===== */
@media (min-width:761px){
  :root{--win:#f3f3f3;--card:#fdfdfd;--card-h:#f6f7f9;--line2:rgba(0,0,0,.055);--txt:#1b1b1b;--txt2:#616161;--sel:rgba(0,0,0,.055)}

  #dnav{display:block!important;padding:0 8px}
  .nrow{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px 0 12px;border-radius:5px;text-align:left;position:relative;color:var(--txt);font-size:14px}

  .nrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nrow .pill2{font-size:11px;font-weight:500;min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:grid;place-items:center;background:var(--line2);color:var(--txt2)}
  .nrow.grp .chv{color:var(--txt2);transition:transform .2s var(--ease)}

  .nrow.in-grp{padding-left:34px}
  .nrow.drop{outline:2px dashed var(--accent);outline-offset:-2px}
  .nsep{height:1px;background:var(--line2);margin:8px 6px}
  .side-bottom{border-top:1px solid var(--line2);padding:8px 10px;gap:4px}
  .side-bottom .txt-btn{font-size:14px;color:var(--txt);padding:7px 8px;border-radius:5px;flex:1;justify-content:flex-start;gap:10px}

  /* zona listei */

  #main{border-radius:8px 0 0 0;box-shadow:inset 1px 1px 0 var(--line2)}

  #main .big-title{padding:4px 0 0}
  #main .big-title h1{font-size:26px;font-weight:600;letter-spacing:-.01em;color:color-mix(in oklab,var(--list) 75%,var(--txt));gap:12px}
  :root.dark #main .big-title h1{color:color-mix(in oklab,var(--list) 70%,#fff)}

/* ===== statistici, poze, glisare, actualizare ===== */
.stat.click{cursor:pointer}
.stat.click:active{transform:scale(.98)}

.chart .bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:color-mix(in oklab,var(--list) 35%,transparent);min-height:3px;transition:background .15s}

.chart .bar b{font-size:10px;color:var(--label2);font-weight:500;white-space:nowrap}
.yearnav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0}
.yearnav b{font-size:17px}
.kpis{display:flex;gap:8px;padding:12px}

.photos .ph{aspect-ratio:1;border-radius:10px;background:var(--fill) center/cover no-repeat;cursor:pointer;position:relative}
.photos .ph.up::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.photos .add{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--label3);display:grid;place-items:center;color:var(--accent)}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;flex-direction:column;animation:fade .2s both}
.viewer .vt{display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.viewer .vt button{color:#fff;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.viewer .vt button.armed{background:var(--red)}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%;padding:0 8px calc(16px + env(safe-area-inset-bottom))}
.irow .sw-ic{position:absolute;top:0;bottom:0;display:grid;place-items:center;width:70px;color:#fff;opacity:.6;transition:opacity .15s}
.irow.swiping.armed .sw-ic{opacity:1}
.irow.swiping{background:var(--swbg)!important}
.irow.swiping > :not(.sw-ic){transform:translateX(var(--dx));transition:none}
.irow > *{transition:transform .22s var(--ease)}
.irow.lifted{z-index:5;transform:translateY(var(--dy)) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.2);transition:none;border-radius:12px}
.irow.drop-before{box-shadow:inset 0 2px 0 var(--list)} .irow.drop-after{box-shadow:inset 0 -2px 0 var(--list)}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:65;display:flex;align-items:center;gap:14px;
  background:var(--accent);color:#fff;border-radius:22px;padding:8px 8px 8px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;animation:tin .3s var(--ease) both}
#updBar button{background:#fff;color:var(--accent);border-radius:16px;padding:6px 12px;font-weight:700;font-size:13.5px}
@media (min-width:761px){ #updBar{bottom:24px} }

/* ===== ecrane tactile: fără efecte de mouse rămase după atingere ===== */
@media (hover:none){
  .irow:hover,.lrow:hover,.kind:hover{background:var(--cell)}
  .tile:hover{background:var(--cell)}
  .circ:hover{background:var(--fill)}
  .irow:not(.done) .chk:hover{border-color:var(--label3);background:none}
  .star:hover{color:var(--label3)} .star.on:hover{color:var(--list)}
  .irow:active,.lrow:active{background:var(--cell-h)}
}

/* ===== telefon ===== */
@media (max-width:760px){
  #app,#app.side-hidden,#app.with-detail,#app.side-hidden.with-detail{grid-template-columns:1fr}
  #detail,.side-btn{display:none!important}
  #side{border-right:0}
  #main{display:none}
  body.in-list #side{display:none}
  body.in-list #main{display:flex;animation:slide .32s var(--ease)}
  body.home-anim #side{animation:slideback .32s var(--ease)}
  @keyframes slide{from{transform:translateX(40px);opacity:.3}}
  @keyframes slideback{from{transform:translateX(-40px);opacity:.3}}
  .back{display:flex}
  .lrow .chev{display:block}
  .lrow.active,.tile.active{background:var(--cell);outline:0}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:12px 12px 0 0;max-width:none;max-height:94%;padding-bottom:env(safe-area-inset-bottom);animation-name:up}
  .scrim.closing .sheet{animation-name:up}
  @keyframes up{from{transform:translateY(100%)}}
  .grab{display:block}
  .stat.more{flex:1 1 100%;justify-content:center;padding:10px 14px}
  .stat .si{display:none}
  .stat{padding:10px 14px}
  .sh-head{padding-top:8px}
}
</style>

/* ---------- formatare ---------- */
function parseNum(s) {
  if (s == null) return null;
  s = String(s).replace(/\s|lei|ron|km|eur|usd|gbp|[€$£]/gi, '');
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');        // 1.250 = o mie două sute cincizeci
  else s = s.replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : null;
}
const CUR = { lei:['', ' lei'], eur:['', ' €'], usd:['$', ''], gbp:['£', ''], none:['', ''] };
const curSym = () => (CUR[ui.currency] || CUR.lei);
const money = n => { const [a, b] = curSym(); return a + (n || 0).toLocaleString('ro-RO', { minimumFractionDigits:(n || 0) % 1 ? 2 : 0, maximumFractionDigits:2 }) + b; };
const kmFmt = n => Math.round(n).toLocaleString('ro-RO') + ' km';
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => ymd(new Date());
function addMonth(s) {
  const [y, m, d] = (s || todayStr()).split('-').map(Number);
  return ymd(new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate())));
}
function dueInfo(s, done) {
  if (!s) return null;
  const t = todayStr(), tm = ymd(new Date(now() + 864e5));
  const [y, m, d] = s.split('-').map(Number);
  const label = s === t ? 'Azi' : s === tm ? 'Mâine'
    : new Date(y, m - 1, d).toLocaleDateString(LOC(), { day:'numeric', month:'short', year: y === new Date().getFullYear() ? undefined : 'numeric' });
  return { label, cls: done ? '' : s < t ? 'late' : s === t ? 'today' : '' };
}
/* Data se alege doar ca zi + lună; anul e cel curent, iar o dată rămasă cu peste o lună în urmă trece în anul următor */
function dateFrom(day, month) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let y = t.getFullYear();
  const mk = yy => new Date(yy, month, Math.min(day, new Date(yy, month + 1, 0).getDate()));
  if (mk(y) < new Date(t.getTime() - 31 * 864e5)) y++;
  return ymd(mk(y));
}
function nextDate(s, rep) {
  const [y, m, d] = (s || todayStr()).split('-').map(Number);
  if (rep === 'daily')  return ymd(new Date(y, m - 1, d + 1));
  if (rep === 'weekly') return ymd(new Date(y, m - 1, d + 7));
  if (rep === 'yearly') return ymd(new Date(y + 1, m - 1, Math.min(d, new Date(y + 1, m, 0).getDate())));
  return addMonth(s);
}
/* Comutator „Dată” + scurtături + selectoare zi / lună */
function dateHTML(val, label = 'Dată limită') {
  const [, m, d] = (val || todayStr()).split('-').map(Number);
  const tm = ymd(new Date(now() + 864e5)), wk = ymd(new Date(now() + 7 * 864e5));
  return `<label class="frow"><span class="fl">${label}${val ? `<small id="dLbl">${esc(dueInfo(val).label)}</small>` : ''}</span><input type="checkbox" class="sw" data-d="on" ${val ? 'checked' : ''}></label>
    <div class="dsel ${val ? '' : 'hidden'}">
      <button class="q ${val === todayStr() ? 'on' : ''}" data-d="q" data-v="${todayStr()}">Azi</button>
      <button class="q ${val === tm ? 'on' : ''}" data-d="q" data-v="${tm}">Mâine</button>
      <button class="q ${val === wk ? 'on' : ''}" data-d="q" data-v="${wk}">Peste o săptămână</button>
      <span class="sp"></span>
      <select data-d="day">${Array.from({ length:31 }, (_, k) => `<option value="${k + 1}" ${k + 1 === d ? 'selected' : ''}>${k + 1}</option>`).join('')}</select>
      <select data-d="month">${MONTHS.map((n, k) => `<option value="${k}" ${k + 1 === m ? 'selected' : ''}>${n}</option>`).join('')}</select>
    </div>`;
}
function wireDate(root, onChange) {
  const q = x => root.querySelector(x);
  const sel = q('.dsel'), on = q('[data-d=on]'), day = q('[data-d=day]'), mon = q('[data-d=month]');
  const set = v => {
    if (v) { const [, m, d] = v.split('-').map(Number); day.value = d; mon.value = m - 1; }
    root.querySelectorAll('[data-d=q]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    const lbl = on.closest('.frow').querySelector('.fl');
    lbl.innerHTML = lbl.firstChild.textContent + (v ? `<small>${esc(dueInfo(v).label)}</small>` : '');
    sel.classList.toggle('hidden', !v);
    onChange(v);
  };
  on.onchange = () => set(on.checked ? todayStr() : '');             // la activare, data implicită este azi
  root.querySelectorAll('[data-d=q]').forEach(b => b.onclick = e => { e.preventDefault(); set(b.dataset.v); });
  day.onchange = mon.onchange = () => set(dateFrom(+day.value, +mon.value));
}

const longDate = () => { const s = new Date().toLocaleDateString(LOC(), { weekday:'long', day:'numeric', month:'long' }); return s[0].toUpperCase() + s.slice(1); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- aspect ---------- */
function applyLook() {
  const dark = ui.mode === 'dark' || (ui.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  document.documentElement.style.setProperty('--accent', accent());
  document.body.classList.toggle('compact', ui.show.compact);
  document.documentElement.classList.toggle('no-anim', ui.anim === 'reduced');
  for (const b of ['soft', 'vivid']) $('#main').classList.toggle(b, ui.bg === b);
  $('#syncBar').classList.toggle('hidden', !ui.show.sync);
  updateBar();
}
function updateBar() {
  const inList = document.body.classList.contains('in-list') && innerWidth <= 760;
  const el = inList ? $('#main') : $('#side');
  requestAnimationFrame(() => {
    const hex = toHex(getComputedStyle(el).backgroundColor); if (!hex) return;
    // iOS 26 nu mai citește theme-color: ia culoarea barei de sus din fundalul lui html/body
    document.documentElement.style.backgroundColor = hex; document.body.style.backgroundColor = hex;
    // iOS 26 nu recitește fundalul când se schimbă, dar citește culoarea unui element fix nou apărut sus → îl recreăm
    if (!isDesk()) {
      $('#sbTint')?.remove();
      const t = document.createElement('div'); t.id = 'sbTint';
      t.style.cssText = `position:fixed;top:0;left:0;right:0;height:3px;z-index:1;pointer-events:none;background:${hex}`;
      document.body.appendChild(t);
    }
    const olds = document.querySelectorAll('meta[name=theme-color]');
    if (!hex || (olds.length === 1 && olds[0].content === hex)) return;
    const m = document.createElement('meta'); m.name = 'theme-color'; m.content = hex;   // element nou, fără „media”: iOS îl preia mai sigur
    olds.forEach(o => o.remove()); document.head.appendChild(m);
  });
}
/* iOS nu înțelege culorile „oklab(...)” produse de color-mix și pune negru; le transformăm în #rrggbb */
const hexCv = document.createElement('canvas'); hexCv.width = hexCv.height = 1;
function toHex(c) {
  try {
    const x = hexCv.getContext('2d', { willReadFrequently:true });
    x.clearRect(0, 0, 1, 1); x.fillStyle = '#000'; x.fillStyle = c; x.fillRect(0, 0, 1, 1);
    const [r, g, b, a] = x.getImageData(0, 0, 1, 1).data;
    if (!a) return null;
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (e) { return null; }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyLook);

  $('#btnListMenu').classList.toggle('hidden', !L);

  $('#addBar').classList.toggle('hidden-bar', !L);

    $('#title').textContent = APP; $('#navTitle').textContent = APP; $('#subtitle').textContent = ''; $('#totals').innerHTML = '';

      : `<div class="empty">${badge(L, '', 30)}<b>Lista e goală</b>Apasă pe + pentru primul element.</div>`;
    return;
  }
  const open = items.filter(i => !i.done).sort(sorter(L));
  const done = items.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  $('#title').innerHTML = `<span class="t-badge">${badge(L, 'lg', 20)}</span><span data-u>${esc(L.name)}</span>`; $('#navTitle').textContent = L.name; $('#navTitle').dataset.u = '';
  $('#subtitle').textContent = open.length ? plural(open.length, 'element rămas', 'elemente rămase') : (done.length ? 'Totul e bifat' : longDate());

  const stats = [];

    if (L.money && !L.km) {
      const start = new Date(); start.setDate(1); start.setHours(0, 0, 0, 0);
      stats.push(['Rămas de plătit', money(open.reduce((s, i) => s + (i.amount || 0), 0)), 'ui-money']);
      stats.push(['Plătit luna aceasta', money(done.filter(i => (i.doneAt || 0) >= start.getTime()).reduce((s, i) => s + (i.amount || 0), 0)), 'ui-check']);
    }
    if (L.money && L.km) {
      const y = new Date().getFullYear();
      stats.push(['Cheltuit anul acesta', money(done.filter(i => new Date(i.doneAt || 0).getFullYear() === y).reduce((s, i) => s + (i.amount || 0), 0)), 'ui-money']);
    }
    if (L.km) {

    ;
  const total = open.length + done.length, pct = total ? Math.round(done.length / total * 100) : 0;

       ${done.length && ['shopping', 'packing'].includes(kindOf(L)) ? `<div><button class="restart" id="restart">${ic('ui-repeat', 17, 2.4)}Începe din nou</button></div>` : ''}</div>`;
  if (done.length && ui.show.done) {                     // ca în To Do: finalizatele rămân în lista lor, într-o secțiune pliabilă

    if (isOpen) html += `<div class="group">${done.map(i => row(i, L)).join('')}</div>`;
  }
  $('#items').innerHTML = html + '<div class="ruled d-only"></div>';
  if (isDesk()) wireDrag();
}

const byDue = (a, b) => {
  if (a.due && b.due) return a.due.localeCompare(b.due) || a.createdAt - b.createdAt;
  if (a.due) return -1; if (b.due) return 1;
  return a.createdAt - b.createdAt;
};

  if (ui.current === '@myday' || ui.current === '@important') {
    $('#items').innerHTML = `<div class="group">${items.sort(byDue).map(i => row(i, db.lists[i.listId], true)).join('')}</div>`;
    return;
  }
  else if (ui.current === '@planned') groups = [['Depășite', i => i.due < t], ['Azi', i => i.due === t], ['Următoarele 7 zile', i => i.due > t && i.due <= wk], ['Mai târziu', i => i.due > wk]];
  else if (ui.current === '@all') {
    $('#items').innerHTML = liveLists().map(l => {
      const g = items.filter(i => i.listId === l.id).sort(byDue); if (!g.length) return '';
      return `<div class="group-h" data-u style="--c:${listColor(l)}">${esc(l.name)}</div><div class="group">${g.map(i => row(i, l)).join('')}</div>`;
    }).join('');

  }
  $('#items').innerHTML = groups.map(([name, f]) => {
    const g = items.filter(f).sort(byDue); if (!g.length) return '';
    return `<div class="group-h">${name}</div><div class="group">${g.map(i => row(i, db.lists[i.listId], true)).join('')}</div>`;
  }).join('');
}

/* reordonare prin tragere (PC) */
function wireDrag() {
  let dragId = null;
  const rows = [...document.querySelectorAll('#items .irow[draggable=true]')];
  const clear = () => rows.forEach(r => r.classList.remove('drop-before', 'drop-after'));
  rows.forEach(r => {
    r.addEventListener('dragstart', e => { dragId = r.dataset.item; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    r.addEventListener('dragend', () => { r.classList.remove('dragging'); clear(); });
    r.addEventListener('dragover', e => {
      if (!dragId || r.dataset.item === dragId) return;
      e.preventDefault(); clear();
      const b = r.getBoundingClientRect(); r.classList.add(e.clientY < b.top + b.height / 2 ? 'drop-before' : 'drop-after');
    });
    r.addEventListener('drop', e => {
      e.preventDefault(); if (!dragId || r.dataset.item === dragId) return;
      const before = r.classList.contains('drop-before'); clear();
      const ids = rows.map(x => x.dataset.item).filter(x => x !== dragId);
      const at = ids.indexOf(r.dataset.item) + (before ? 0 : 1);
      const prev = db.items[ids[at - 1]], next = db.items[ids[at]];
      const it = db.items[dragId];
      it.order = prev && next ? (ord(prev) + ord(next)) / 2 : prev ? ord(prev) + 1000 : next ? ord(next) - 1000 : now();
      it.updatedAt = now(); commit();
    });
  });
}

/* ---------- export pentru Excel (CSV cu ; și virgulă zecimală) ---------- */
function exportCSV(listIds) {
  const ids = listIds || liveLists().map(l => l.id);
  const q = v => { v = v == null ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const num = n => n == null ? '' : String(n).replace('.', ',');
  const d = s => s ? s.split('-').reverse().join('.') : '';
  const rows = [['Listă', 'Titlu', 'Sumă' + (curSym().join('').trim() ? ' (' + curSym().join('').trim() + ')' : ''), 'Kilometraj', 'Stare', 'Data bifării', 'Dată limită', 'Notă']];
  for (const id of ids) {
    const L = db.lists[id];
    itemsOf(id).sort((a, b) => (a.done - b.done) || (ord(a) - ord(b))).forEach(i => rows.push([
      L.name, i.title, num(i.amount), num(i.km), isPlain(L) ? '' : i.done ? 'Finalizat' : 'De făcut',
      i.doneAt ? new Date(i.doneAt).toLocaleDateString(LOC()) : '', d(i.due), (i.note || '').replace(/\n/g, ' ')]));
  }
  const csv = '\uFEFF' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const name = ids.length === 1 ? db.lists[ids[0]].name : 'toate-listele';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `${APP.toLowerCase()}-${name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-')}-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- următoarea revizie (liste cu kilometraj) ---------- */
function titleDate(t) {
  let m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t || ''); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = /(?:^|\D)(\d{1,2})\.(\d{4})/.exec(t || ''); if (m) return `${m[2]}-${m[1].padStart(2, '0')}-01`;
  return '';
}
function nextRevision(L) {
  const all = itemsOf(L.id);
  const recs = all.filter(i => i.km != null && !i.nextRev); if (!recs.length) return null;
  const last = recs.reduce((a, b) => (b.km > a.km ? b : a));
  const lastDate = last.due || titleDate(last.title) || (last.doneAt ? ymd(new Date(last.doneAt)) : ymd(new Date(last.createdAt)));
  const [y, m, d] = lastDate.split('-').map(Number);
  const months = L.revMonths ?? 12, kmStep = L.revKm ?? 15000;
  const dt = new Date(y, m - 1 + months, Math.min(d, 28));
  return { km: last.km + kmStep, due: ymd(dt), label: dt.toLocaleDateString(LOC(), { month:'long', year:'numeric' }),
           pending: all.find(i => i.nextRev && !i.done) };
}
function planRevision(listId) {
  const L = db.lists[listId], n = nextRevision(L); if (!n) return;
  if (n.pending) return editItem(n.pending.id);
  const id = uid(), ts = now();
  db.items[id] = { id, listId, title:'Următoarea revizie', note:'', amount:null, km:n.km, due:n.due, repeat:'', star:false, myDay:'', steps:[],
                   nextRev:true, done:false, doneAt:null, order:ts, createdAt:ts, updatedAt:ts };
  commit(); toast(`Adăugată în Planificate: ${n.label}, sau la ${kmFmt(n.km)}`);
}

/* ---------- poze atașate ----------
   Pozele se micșorează (max. 1600 px, JPEG) și se păstrează pe dispozitiv; cu sincronizarea activă
   se urcă și în repository-ul de date, în folderul „poze”, ca să apară pe toate dispozitivele. */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('bifa-poze', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('p', mode); const r = fn(t.objectStore('p')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return { get:k => tx('readonly', s => s.get(k)), put:(k, v) => tx('readwrite', s => s.put(v, k)), del:k => tx('readwrite', s => s.delete(k)) };
})();
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}
const blobB64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(b); });
const photoUrl = p => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/poze/${p.id}.jpg`;
async function uploadPhoto(item, p) {
  if (!cfg.token || p.up) return;
  const blob = await idb.get(p.id); if (!blob) return;
  const r = await fetch(photoUrl(p), { method:'PUT', headers:{ ...ghHeaders(cfg.token), 'Content-Type':'application/json' },
    body:JSON.stringify({ message:'Poză: ' + item.title.slice(0, 50), content:await blobB64(blob) }) });
  if (r.ok || r.status === 422) { p.up = true; item.updatedAt = now(); store(LS_DATA, db); scheduleSync(); }
}
async function uploadPending() {
  for (const i of liveItems()) for (const p of (i.photos || [])) if (!p.up) { try { await uploadPhoto(i, p); } catch {} }
}
const urlCache = {};
async function photoSrc(p) {
  if (urlCache[p.id]) return urlCache[p.id];
  let b = await idb.get(p.id).catch(() => null);
  if (!b && cfg.token && p.up) {
    const r = await fetch(photoUrl(p) + '?t=' + now(), { headers:{ ...ghHeaders(cfg.token), 'Accept':'application/vnd.github.raw' }, cache:'no-store' });
    if (r.ok) { b = await r.blob(); idb.put(p.id, b).catch(() => {}); }
  }
  return b ? (urlCache[p.id] = URL.createObjectURL(b)) : '';
}
async function addPhotos(item, files) {
  item.photos = item.photos || [];
  for (const f of files) {
    try {
      const blob = await shrink(f); const p = { id:uid() };
      await idb.put(p.id, blob); item.photos.push(p);
      touchItem(item); refreshDetail();
      uploadPhoto(item, p).then(refreshDetail).catch(() => {});
    } catch { toast('Poza nu a putut fi citită'); }
  }
}
async function removePhoto(item, pid) {
  const p = (item.photos || []).find(x => x.id === pid); if (!p) return;
  item.photos = item.photos.filter(x => x.id !== pid); touchItem(item); refreshDetail();
  idb.del(pid).catch(() => {});
  if (cfg.token && p.up) try {
    const g = await fetch(photoUrl(p), { headers:ghHeaders(cfg.token), cache:'no-store' });
    if (g.ok) { const { sha } = await g.json();
      await fetch(photoUrl(p), { method:'DELETE', headers:{ ...ghHeaders(cfg.token), 'Content-Type':'application/json' }, body:JSON.stringify({ message:'Poză ștearsă', sha }) }); }
  } catch {}
}
async function viewPhoto(item, pid) {
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<div class="vt"><button id="vX">${ic('ui-x', 20, 2.4)}</button><button id="vDel">${ic('ui-trash', 19, 2.2)}</button></div><img alt="">`;
  document.body.appendChild(v);
  v.querySelector('img').src = await photoSrc(item.photos.find(x => x.id === pid));
  const close = () => v.remove();
  v.querySelector('#vX').onclick = close;
  armed(v.querySelector('#vDel'), () => { close(); removePhoto(item, pid); });
}

/* ---------- gesturi pe ecran tactil ----------

let suppressClick = false;
(() => {
  const box = $('#items');
  let st = null;
  const reset = () => {
    if (!st) return;
    const r = st.row;
    r.classList.remove('swiping', 'armed', 'lifted'); r.style.removeProperty('--dx'); r.style.removeProperty('--dy'); r.style.removeProperty('--swbg');
    r.querySelector('.sw-ic')?.remove();
    box.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
    clearTimeout(st.lp); st = null;
  };
  box.addEventListener('touchstart', e => {
    if (isDesk() || e.touches.length > 1) return;
    const row = e.target.closest('.irow'); if (!row) return;
    const t = e.touches[0];
    st = { row, x:t.clientX, y:t.clientY, mode:null };
    if (row.getAttribute('draggable') === 'true')
      st.lp = setTimeout(() => { if (st && !st.mode) { st.mode = 'drag'; row.classList.add('lifted'); navigator.vibrate?.(8); } }, 420);
  }, { passive:true });
  box.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0], dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (!st.mode) {

        const it = db.items[st.row.dataset.item], L = it && db.lists[it.listId];
        st.mode = 'swipe'; st.plain = isPlain(L); clearTimeout(st.lp);
      } else if (Math.abs(dy) > 10) { clearTimeout(st.lp); st = null; return; }
      else return;
    }
    e.preventDefault();
    const r = st.row;
    if (st.mode === 'swipe') {
      const d = st.plain ? Math.min(0, dx) : dx;
      r.classList.add('swiping'); r.style.setProperty('--dx', d + 'px');
      const right = d > 0;
      r.style.setProperty('--swbg', right ? '#34c759' : 'var(--red)');
      let icn = r.querySelector('.sw-ic');
      if (!icn) { icn = document.createElement('span'); icn.className = 'sw-ic'; r.appendChild(icn); }
      icn.style.left = right ? '0' : ''; icn.style.right = right ? '' : '0';
      icn.innerHTML = right ? ic('ui-check', 24, 2.8) : ic('ui-trash', 22, 2.2);
      r.classList.toggle('armed', Math.abs(d) > 90);
      st.dx = d;
    } else if (st.mode === 'drag') {
      r.style.setProperty('--dy', dy + 'px');
      const rows = [...box.querySelectorAll('.irow[draggable=true]')].filter(x => x !== r);
      rows.forEach(x => x.classList.remove('drop-before', 'drop-after'));
      const y = t.clientY; let target = null, before = true;
      for (const x of rows) { const b = x.getBoundingClientRect(); if (y < b.top + b.height / 2) { target = x; before = true; break; } target = x; before = false; }
      if (target) target.classList.add(before ? 'drop-before' : 'drop-after');
      st.target = target; st.before = before;
    }
  }, { passive:false });
  const end = () => {
    if (!st) return;
    const s2 = st, id = s2.row.dataset.item;
    if (s2.mode) { suppressClick = true; setTimeout(() => suppressClick = false, 350); }
    if (s2.mode === 'swipe' && Math.abs(s2.dx || 0) > 90) {
      reset();
      if (s2.dx > 0) toggleItem(id); else deleteItem(id);
      return;
    }
    if (s2.mode === 'drag' && s2.target) {
      const ids = [...box.querySelectorAll('.irow[draggable=true]')].map(x => x.dataset.item).filter(x => x !== id);
      const at = ids.indexOf(s2.target.dataset.item) + (s2.before ? 0 : 1);
      const prev = db.items[ids[at - 1]], next = db.items[ids[at]], it = db.items[id];
      reset();
      it.order = prev && next ? (ord(prev) + ord(next)) / 2 : prev ? ord(prev) + 1000 : next ? ord(next) - 1000 : now();
      it.updatedAt = now(); commit(); return;
    }

})();

}

      const dateBox = () => {
        q('#cDate').innerHTML = `<div class="fgroup" style="margin:0">${dateHTML(due, 'Dată')}</div>`;
        wireDate(q('#cDate'), v => { due = v; showDue(); });
      };
      fields(); showDue();
      if (q('#cList')) q('#cList').onchange = () => { L = db.lists[q('#cList').value]; fields(); };
      t.oninput = () => send.disabled = !t.value.trim();
      amt.oninput = () => on(q('#pAmt'), !!amt.value);
      km.oninput = () => on(q('#pKm'), !!km.value);
      q('#pDue').onclick = () => {                     // prima apăsare: data devine azi și apar selectoarele
        const box = q('#cDate');
        if (box.classList.contains('hidden')) { if (!due) due = todayStr(); showDue(); dateBox(); box.classList.remove('hidden'); }
        else box.classList.add('hidden');
      };
      q('#pRep').onclick = () => { rep = !rep; on(q('#pRep'), rep); };
      const add = () => {
        const title = t.value.trim(); if (!title) return;
        const id = uid(), ts = now();
        db.items[id] = { id, listId:L.id, title, note:'', amount: L.money ? parseNum(amt.value) : null, km: L.km ? parseNum(km.value) : null,
                         due, repeat: rep ? 'monthly' : '', star: ui.current === '@important', myDay: ui.current === '@myday' ? todayStr() : '',
                         steps:[], done:false, doneAt:null, order:ts, createdAt:ts, updatedAt:ts };
        closeSheet();
        commit();
      };
      send.onclick = add;
      t.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
      [amt, km].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } }));
      t.focus({ preventScroll:true });              // direct, în aceeași atingere: altfel iPhone nu deschide tastatura
      setTimeout(() => { if (document.activeElement !== t) t.focus({ preventScroll:true }); }, 60);
    }, 'composer');
}

/* Detaliile unui element: pe PC apar într-un panou în dreapta (ca în To Do), pe telefon într-o foaie.
   Modificările se salvează automat. */
let detailId = null;
const wide = () => innerWidth > 1000;
function editItem(id) {
  if (!db.items[id]) return;
  detailId = id;
  if (wide()) {
    $('#app').classList.add('with-detail');
    $('#detail').innerHTML = `<div class="nav" style="position:static"><span class="l"></span><span></span>
      <div class="r"><button class="circ" id="dClose" title="Închide" aria-label="Închide">${ic('ui-x', 18, 2.4)}</button></div></div>
      <div class="sh-body" id="dBody"></div><div class="d-foot" id="dFoot"></div>`;
    $('#dClose').onclick = closeDetail;
    refreshDetail();
    render();
  } else {
    openSheet(`${shHead('Detalii', 'Gata', '')}<div class="sh-body" id="dBody"></div><div class="d-foot" id="dFoot"></div>`, s => {
      s.querySelector('#ok').onclick = () => closeSheet();
      refreshDetail();
    });
  }
}
function closeDetail() {
  detailId = null; $('#app').classList.remove('with-detail'); $('#detail').innerHTML = ''; render();
}
let saveT;
function touchItem(i, rerender = true) {
  db.items[i.id] = i;                                  // varianta editată rămâne cea valabilă, chiar dacă a venit între timp o sincronizare
  i.updatedAt = now(); store(LS_DATA, db); scheduleSync();
  if (rerender) { clearTimeout(saveT); saveT = setTimeout(render, 200); }
}
function refreshDetail() {
  const body = document.querySelector('#dBody'); if (!body) return;
  const i = db.items[detailId]; if (!i || i.deleted) { if (wide()) closeDetail(); else closeSheet(); return; }
  const L = db.lists[i.listId]; const plain = isPlain(L);
  i.steps = i.steps || [];
  const opts = liveLists().map(l => `<option value="${esc(l.id)}" ${l.id === i.listId ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
  body.style.setProperty('--list', listColor(L));
  body.innerHTML = `
    <div class="fgroup">
      <div class="d-title ${i.done ? 'irow done' : ''}" style="background:none;animation:none;padding:12px 14px">
        ${plain ? '<span class="bullet"></span>' : `<button class="chk" id="dChk">${ic('ui-check', 14, 3.2)}</button>`}
        <input id="dTitle" value="${esc(i.title)}" placeholder="Titlu">
        ${plain ? '' : `<button class="star ${i.star ? 'on' : ''}" id="dStar">${ic('ui-star', 20, 2)}</button>`}
      </div>
      ${plain ? '' : i.steps.map(x => `<div class="step ${x.d ? 'done' : ''}" data-step="${x.id}">
          <button class="chk" style="${x.d ? 'background:var(--list);border-color:var(--list);color:#fff' : ''}" data-sd="${x.id}">${ic('ui-check', 12, 3.4)}</button>
          <input value="${esc(x.t)}" data-st="${x.id}"><button class="x" data-sx="${x.id}">${ic('ui-x', 15, 2.4)}</button></div>`).join('') + `
        <label class="add-step">${ic('ui-plus', 20, 2.4)}<input id="dStep" placeholder="Adaugă un pas"></label>`}
    </div>
    ${plain ? '' : `<div class="fgroup"><div class="frow btnrow ${i.myDay === todayStr() ? 'myday-on' : ''}" id="dMyDay" style="justify-content:flex-start;gap:10px">
      ${ic('ui-myday', 20, 2)}${i.myDay === todayStr() ? 'Adăugat la Ziua mea' : 'Adaugă la Ziua mea'}</div></div>`}
    ${plain && !L.money && !L.km ? '' : `<div class="fgroup">
      ${plain ? '' : `<div id="dDate">${dateHTML(i.due)}</div>
      <label class="frow"><span class="fl">Repetă</span><select id="dRep">${Object.entries(REPEATS).map(([k, v]) => `<option value="${k}" ${(i.repeat || '') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`}
      ${L.money ? `<label class="frow"><span class="fl">Sumă</span><input id="dAmt" inputmode="decimal" placeholder="${money(0)}" value="${i.amount != null ? String(i.amount).replace('.', ',') : ''}"></label>` : ''}
      ${L.km ? `<label class="frow"><span class="fl">Kilometraj</span><input id="dKm" inputmode="numeric" placeholder="0 km" value="${i.km ?? ''}"></label>` : ''}
    </div>`}
    <div class="fgroup"><label class="frow input"><textarea id="dNote" placeholder="${tr('Adaugă o notă')}">${esc(i.note)}</textarea></label></div>
    <div class="fh">Poze</div>
    <div class="fgroup"><div class="photos" id="dPhotos">${(i.photos || []).map(p => `<div class="ph ${p.up || !cfg.token ? '' : 'up'}" data-ph="${p.id}" title="${p.up || !cfg.token ? '' : 'Se urcă…'}"></div>`).join('')}
      <label class="add" title="Adaugă poză">${ic('ui-camera', 24, 2)}<input type="file" accept="image/*" multiple hidden id="dPhotoIn"></label></div></div>
    <div class="fgroup"><label class="frow"><span class="fl">Listă</span><select id="dList">${opts}</select></label></div>`;
  $('#dFoot') && ($('#dFoot').innerHTML = `<span>Creat ${new Date(i.createdAt).toLocaleDateString(LOC(), { day:'numeric', month:'long', year:'numeric' })}</span>
    <button id="dDel" title="Șterge">${ic('ui-trash', 19, 2)}</button>`);
  const q = x => document.querySelector(x);

  q('#dTitle').oninput = e => { if (e.target.value.trim()) { i.title = e.target.value.trim(); touchItem(i); } };
  if (q('#dChk')) q('#dChk').onclick = () => toggleItem(i.id);
  if (q('#dStar')) q('#dStar').onclick = () => toggleStar(i.id);
  if (q('#dMyDay')) q('#dMyDay').onclick = () => { i.myDay = i.myDay === todayStr() ? '' : todayStr(); touchItem(i); refreshDetail(); };
  if (q('#dDate')) wireDate(q('#dDate'), v => { i.due = v; touchItem(i); });
  if (q('#dRep')) q('#dRep').onchange = e => { i.repeat = e.target.value; if (i.repeat && !i.due) i.due = todayStr(); touchItem(i); refreshDetail(); };
  if (q('#dAmt')) q('#dAmt').oninput = e => { i.amount = parseNum(e.target.value); touchItem(i); };
  if (q('#dKm')) q('#dKm').oninput = e => { i.km = parseNum(e.target.value); touchItem(i); };
  q('#dNote').oninput = e => { i.note = e.target.value; touchItem(i); };
  q('#dPhotoIn').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) addPhotos(i, f); };
  body.querySelectorAll('[data-ph]').forEach(async el => {
    const p = i.photos.find(x => x.id === el.dataset.ph);
    el.onclick = () => viewPhoto(i, p.id);
    const src = await photoSrc(p).catch(() => ''); if (src) el.style.backgroundImage = `url("${src}")`;
  });
  q('#dList').onchange = e => { i.listId = e.target.value; touchItem(i); refreshDetail(); };
  /* pași */
  const st = q('#dStep');
  if (st) st.onkeydown = e => {
    if (e.key === 'Enter' && st.value.trim()) {
      e.preventDefault(); i.steps.push({ id:uid(), t:st.value.trim(), d:false }); touchItem(i); refreshDetail(); q('#dStep').focus();
    }
  };
  body.querySelectorAll('[data-sd]').forEach(b => b.onclick = () => { const x = i.steps.find(s => s.id === b.dataset.sd); x.d = !x.d; if (x.d) ding(); touchItem(i); refreshDetail(); });
  body.querySelectorAll('[data-st]').forEach(inp => inp.oninput = () => { const x = i.steps.find(s => s.id === inp.dataset.st); if (inp.value.trim()) { x.t = inp.value.trim(); touchItem(i); } });
  body.querySelectorAll('[data-sx]').forEach(b => b.onclick = () => { i.steps = i.steps.filter(s => s.id !== b.dataset.sx); touchItem(i); refreshDetail(); });
  armed(q('#dDel'), () => { i.deleted = true; touchItem(i, false); if (wide()) closeDetail(); else closeSheet(); commit(); });
}

function editList(id, newKind) {
  const isNew = !id;
  const K = KINDS[newKind || 'todo'];
  const L = isNew ? { name:K.name, kind:newKind || 'todo', icon:K.icon, color:K.color, money:K.money, km:K.km } : db.lists[id];
  let kind = kindOf(L);
  const items = isNew ? [] : itemsOf(id);
  const doneCount = items.filter(i => i.done).length;
  let icon = L.icon || '', color = L.color || '';
  openSheet(`${isNew ? `<div class="sh-head"><button class="sh-btn" id="lBack" style="display:flex;align-items:center;margin-left:-6px">${ic('ui-back', 22, 2.4)}Tip</button><b>${esc(K.name)}</b><button class="sh-btn strong" id="ok">Creează</button></div>`
                    : shHead('Opțiuni listă')}
    <div class="sh-body" id="lBody">
      <div class="fgroup"><div class="preview" id="lPrev"></div></div>
      <div class="fgroup"><div class="swatches" id="lCols" style="grid-template-columns:repeat(7,1fr)">${swatches(color, true)}</div></div>
      <div class="fgroup"><div class="icons" id="lIcons">${LIST_ICONS.map(n => `<button data-ic="${n}" title="${n}">${ic(n, 20, 2.2)}</button>`).join('')}</div></div>
      <div class="fh">Câmpuri</div>
      <div class="fgroup">
        <label class="frow"><span class="fl">Ordonare</span><select id="lSort">${Object.entries(SORTS).filter(([k]) => (k !== 'amount' || L.money) && (k !== 'km' || L.km)).map(([k, v]) => `<option value="${k}" ${(L.sort || 'manual') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        ${liveGroups().length ? `<label class="frow"><span class="fl">Grup</span><select id="lGroup"><option value="">Fără grup</option>${liveGroups().map(g => `<option value="${esc(g.id)}" ${L.group === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>` : ''}
        ${isNew ? '' : `<label class="frow"><span class="fl">Tip listă</span><select id="lKind">${Object.entries(KINDS).map(([k, t]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${t.name}</option>`).join('')}</select></label>`}
        <label class="frow"><span class="fl">Sume<small>Total rămas și plătit</small></span><input type="checkbox" class="sw" id="lMoney" ${L.money ? 'checked' : ''}></label>
        <label class="frow"><span class="fl">Kilometraj<small>Pentru revizii și întreținere auto</small></span><input type="checkbox" class="sw" id="lKm" ${L.km ? 'checked' : ''}></label>
        <label class="frow" id="lRevRow1"><span class="fl">Revizie la fiecare<small>Pentru calculul următoarei revizii</small></span><input id="lRevKm" inputmode="numeric" value="${(L.revKm ?? 15000).toLocaleString('ro-RO')}" style="max-width:110px"></label>
        <label class="frow" id="lRevRow2"><span class="fl">sau la fiecare (luni)</span><input id="lRevMonths" inputmode="numeric" value="${L.revMonths ?? 12}" style="max-width:80px"></label>
      </div>
      ${isNew ? '' : `
      <div class="fh">Acțiuni</div>
      <div class="fgroup">
        <div class="frow btnrow" id="lReset" aria-disabled="${!doneCount}">Debifează tot</div>
        <div class="frow btnrow" id="lClear" aria-disabled="${!doneCount}">Șterge elementele finalizate</div>
        <div class="frow btnrow" id="lExport">Exportă lista în Excel</div>
      </div>
      <div class="ff">„Debifează tot” e util pentru liste refolosite, de exemplu bagajul pentru vacanță.</div>
      <div class="fgroup"><div class="frow btnrow red" id="lDel">Șterge lista</div></div>`}
    </div>`, s => {
      const q = x => s.querySelector(x);
      const prev = q('#lPrev');
      prev.innerHTML = `<span id="pvBadge"></span><input id="lName" value="${esc(L.name)}" placeholder="Numele listei" autocomplete="off">`;
      const paint = () => {
        const fake = { icon, color, emoji:L.emoji };
        q('#pvBadge').outerHTML = `<span id="pvBadge">${badge(fake, '', 44)}</span>`;
        q('#lBody').style.setProperty('--c', listColor(fake));
        s.querySelectorAll('[data-ic]').forEach(b => b.classList.toggle('on', b.dataset.ic === icon));
        s.querySelectorAll('[data-col]').forEach(b => b.classList.toggle('on', b.dataset.col === color));
      };
      paint();
      s.querySelectorAll('[data-ic]').forEach(b => b.onclick = () => { icon = b.dataset.ic; paint(); });
      s.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { color = b.dataset.col; paint(); });
      const revVis = () => ['#lRevRow1', '#lRevRow2'].forEach(x => q(x).classList.toggle('hidden', !q('#lKm').checked));
      q('#lKm').addEventListener('change', revVis); revVis();
      if (!isNew && q('#lExport')) q('#lExport').onclick = () => exportCSV([id]);
      if (isNew) {
        q('#lBack').onclick = chooseKind;
        setTimeout(() => { q('#lName').focus(); q('#lName').select(); }, 80);
      } else {
        q('#lKind').onchange = () => {                   // la schimbarea tipului se potrivesc și câmpurile
          kind = q('#lKind').value; q('#lMoney').checked = KINDS[kind].money; q('#lKm').checked = KINDS[kind].km;
        };
        q('#lReset').onclick = () => { items.filter(i => i.done).forEach(i => { i.done = false; i.doneAt = null; i.updatedAt = now(); }); closeSheet(); commit(); };
        armed(q('#lClear'), () => { items.filter(i => i.done).forEach(i => { i.deleted = true; i.updatedAt = now(); }); closeSheet(); commit(); });
        armed(q('#lDel'), () => {
          items.forEach(i => { i.deleted = true; i.updatedAt = now(); });
          L.deleted = true; L.updatedAt = now(); ui.current = null; saveUI();
          closeSheet(); goHome(); commit();
        });
      }
      q('#ok').onclick = () => {
        const name = q('#lName').value.trim(); if (!name) return q('#lName').focus();
        const fields = { name, kind, icon, color, money:q('#lMoney').checked, km:q('#lKm').checked, updatedAt:now(),
                         revKm: parseNum(q('#lRevKm').value) || 15000, revMonths: parseInt(q('#lRevMonths').value) || 12 };
        if (q('#lGroup')) fields.group = q('#lGroup').value;
        fields.sort = q('#lSort').value;
        if (isNew) {
          const nid = uid();
          db.lists[nid] = { id:nid, order:Math.max(0, ...liveLists().map(l => l.order || 0)) + 1, ...fields };
          closeSheet(); commit(); openList(nid);
        } else { Object.assign(L, fields); closeSheet(); commit(); }
      };
    });
}

/* ---------- sincronizare GitHub ----------
   Fiecare listă și fiecare element are „updatedAt”. La sincronizare se combină datele locale
   cu cele din GitHub, păstrând varianta cea mai nouă a fiecăruia. Elementele șterse rămân
   marcate („deleted”) 60 de zile, ca ștergerea să ajungă pe toate dispozitivele. */
let syncState = 'local', syncErr = '', syncing = false, again = false, syncTimer = null;
const ghHeaders = token => ({ 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' });
const ghFileUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${FILE}`;
function b64e(str) {
  const b = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64d(s) {
  const bin = atob(s.replace(/\s/g, '')); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
async function ghGet() {
  const r = await fetch(ghFileUrl() + '?t=' + now(), { headers:ghHeaders(cfg.token), cache:'no-store' });
  if (r.status === 404) return { data:null, sha:null };
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json();
  return { data:normalize(JSON.parse(b64d(j.content))), sha:j.sha };
}
async function ghPut(data, sha) {
  const body = { message:'Actualizare liste', content:b64e(JSON.stringify(data, null, 1)) };
  if (sha) body.sha = sha;
  const r = await fetch(ghFileUrl(), { method:'PUT', headers:{ ...ghHeaders(cfg.token), 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return null;
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return (await r.json()).content.sha;
}
function merge(a, b) {
  const out = { lists:{}, items:{}, groups:{} };
  for (const k of ['lists', 'items', 'groups']) {
    const ids = new Set([...Object.keys(a[k] || {}), ...Object.keys(b[k] || {})]);
    for (const id of ids) {
      const x = (a[k] || {})[id], y = (b[k] || {})[id];
      out[k][id] = !x ? y : !y ? x : ((y.updatedAt || 0) > (x.updatedAt || 0) ? y : x);
    }
  }
  return out;
}
function prune(d) {
  const limit = now() - 60 * 864e5;
  for (const k of ['lists', 'items', 'groups']) for (const id in (d[k] || {})) if (d[k][id].deleted && (d[k][id].updatedAt || 0) < limit) delete d[k][id];
  return d;
}
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}
function setStatus(s, err) {
  syncState = s; syncErr = err || '';
  $('#syncDot').className = 'dot ' + (s === 'local' ? '' : s);
  const t = cfg.lastSync ? new Date(cfg.lastSync).toLocaleTimeString('ro-RO', { hour:'2-digit', minute:'2-digit' }) : '';
  $('#syncText').textContent = { local:'Doar pe acest dispozitiv', syncing:'Se sincronizează…', ok:'Sincronizat' + (t ? ' · ' + t : ''),
    offline:'Offline · se sincronizează la reconectare', error:'Eroare sincronizare' }[s];
  $('#syncText').title = syncErr;
}
function scheduleSync(ms = 1500) { if (!cfg.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync() {
  if (!cfg.token) return setStatus('local');
  if (syncing) { again = true; return; }
  syncing = true; setStatus('syncing');
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = await ghGet();
      const merged = prune(r.data ? merge(db, r.data) : db);
      if (stable(merged) !== stable(db)) { db = merged; store(LS_DATA, db); render(); if (detailId && !document.querySelector('#dBody')?.contains(document.activeElement)) refreshDetail(); }
      if (r.data && stable(db) === stable(r.data)) break;
      if (await ghPut(db, r.sha)) break;
    }
    cfg.lastSync = now(); store(LS_CFG, cfg); setStatus('ok');
    uploadPending();
  } catch (e) {
    setStatus(navigator.onLine === false ? 'offline' : 'error', e.message);
  } finally {
    syncing = false;
    if (again) { again = false; scheduleSync(300); }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
addEventListener('online', () => sync());
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 30000);

 'Token-ul trebuie să înceapă cu „github_pat_”. Verifică dacă s-a copiat întreg.':'The token must start with “github_pat_”. Check it was copied completely.',
 'Fișierul nu este un backup valid.':'This file is not a valid backup.','Atenție':'Warning','OK':'OK',
 'Adaugă la Ziua mea ':'Add to My Day','Elimină din Ziua mea':'Remove from My Day','Marchează ca important':'Mark as important','Elimină importanța':'Remove importance',
 'Marchează ca finalizat':'Mark as completed','Marchează ca nefinalizat':'Mark as not completed','Scadent azi':'Due today','Scadent mâine':'Due tomorrow','Alege o dată…':'Pick a date…',
