};
const EN_RX = [
 [/^(\d+) element rămas$/, '$1 item left'], [/^(\d+) elemente rămase$/, '$1 items left'],
 [/^(\d+) element$/, '$1 item'], [/^(\d+) elemente$/, '$1 items'], [/^(\d+) din (\d+)$/, '$1 of $2'],
 [/^Adaugă în (.+)$/, 'Add to $1'], [/^Sincronizat · (.+)$/, 'Synced · $1'], [/^Sincronizat$/, 'Synced'], [/^Statistici · (.+)$/, 'Statistics · $1'],
 [/^Total (\d{4})$/, 'Total $1'], [/^sau în (.+)$/, 'or by $1'], [/^Creat (.+)$/, 'Created $1'],
 [/^„(.+)” a fost șters$/, '“$1” was deleted'], [/^Lista „(.+)” a fost ștearsă$/, 'List “$1” was deleted'],
 [/^Adăugată în Planificate: (.+), sau la (.+)$/, 'Added to Planned: $1, or at $2'],
 [/^Nu am găsit „(.+)” în nicio listă\.$/, 'Couldn’t find “$1” in any list.'],
 [/^Conectat, dar sincronizarea a eșuat: (.*)$/, 'Connected, but sync failed: $1'],
 [/^Token-ul copiat are (\d+) caractere, iar unul complet are 93\. Copiază-l din nou, întreg\.$/, 'The pasted token has $1 characters; a complete one has 93. Copy it again in full.'],
 [/^Poză: (.*)$/, 'Photo: $1']
];
function tr(str) {
  const k = str.trim(); if (!k) return str;
  if (EN[k]) return str.replace(k, EN[k]);
  for (const [r, v] of EN_RX) if (r.test(k)) return str.replace(k, k.replace(r, v));
  return str;
}
function translate(root) {
  if (ui.lang !== 'en' || !root) return;
  const skip = n => { for (let e = n.nodeType === 1 ? n : n.parentElement; e; e = e.parentElement) {
    if (e.hasAttribute && (e.hasAttribute('data-u') || e.classList.contains('t') || e.classList.contains('nm') || e.classList.contains('lst') || e.tagName === 'TEXTAREA')) return true; }
    return false; };
  if (root.nodeType === 3) { if (!skip(root)) { const v = tr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  const texts = []; while ((n = w.nextNode())) texts.push(n);
  texts.forEach(t => { if (!skip(t)) { const v = tr(t.nodeValue); if (v !== t.nodeValue) t.nodeValue = v; } });
  [root, ...root.querySelectorAll('[placeholder],[title],[aria-label]')].forEach(e => {
    if (!e.getAttribute || skip(e)) return;
    for (const a of ['placeholder', 'title', 'aria-label']) { const v = e.getAttribute(a); if (v) { const t2 = tr(v); if (t2 !== v) e.setAttribute(a, t2); } }
  });
}
if (ui.lang === 'en') {
  document.documentElement.lang = 'en';
  new MutationObserver(ms => ms.forEach(m => { m.addedNodes.forEach(translate); if (m.type === 'characterData') translate(m.target); if (m.type === 'attributes') translate(m.target); }))
    .observe(document.body, { childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['placeholder', 'title'] });
}

/* ---------- blocare cu Face ID / Touch ID (cheie de acces locală, WebAuthn) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function lockSetup() {
  try {
    if (!window.PublicKeyCredential) return false;
    const cred = await navigator.credentials.create({ publicKey:{
      challenge:rnd(32), rp:{ name:'Bifa' }, user:{ id:rnd(16), name:'Bifa', displayName:'Bifa' },
      pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' }, timeout:60000 } });
    if (!cred) return false;
    ui.lockId = b64(cred.rawId); saveUI(); return true;
  } catch (e) { return false; }
}
async function lockVerify() {
  try {
    const a = await navigator.credentials.get({ publicKey:{ challenge:rnd(32), timeout:60000, userVerification:'required',
      allowCredentials:[{ type:'public-key', id:unb64(ui.lockId) }] } });
    return !!a;
  } catch (e) { return false; }
}
let unlocking = false, hiddenAt = 0;
async function unlock() {
  if (unlocking) return; unlocking = true;
  const ok = await lockVerify(); unlocking = false;
  if (ok) $('#lock').hidden = true; else $('#lockMsg').textContent = tr('Atinge butonul pentru a debloca');
}
function lockNow() { if (!ui.lockId) return; $('#lock').hidden = false; $('#lockMsg').textContent = tr('Aplicația este blocată'); }
$('#lockBtn').onclick = unlock;
document.addEventListener('visibilitychange', () => {
  if (!ui.lockId) return;
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000 && $('#lock').hidden) { lockNow(); unlock(); }
});
if (ui.lockId) { lockNow(); unlock(); }

if (ui.startList && (isSmart(ui.startList) || (db.lists[ui.startList] && !db.lists[ui.startList].deleted))) ui.current = ui.startList;
applyLook();
render();
translate(document.body);
if (ui.current) document.body.classList.add('in-list');      // pe telefon se deschide direct ultima listă
updateBar();
setStatus(cfg.token ? 'ok' : 'local');
if (cfg.token) sync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setInterval(checkUpdate, 10 * 60 * 1000);
